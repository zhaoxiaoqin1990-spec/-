<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土木工程专业英语学习系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#d97757;--primary-dark:#b85a3e;--primary-light:#f5e6de;
  --bg:#faf9f7;--card:#fff;--text:#1f1e1c;--text-soft:#5a5754;--text-muted:#8b8680;
  --border:#e8e4dd;--shadow:0 4px 24px rgba(31,30,28,.06);
  --green:#2e7d5b;--blue:#3b6fa0;--purple:#7c5cbf;--red:#c0392b;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}

/* Top Bar */
.topbar{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(185,90,62,.3)}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;padding:0 16px}
.topbar .logo{font-size:18px;font-weight:700;padding:14px 0;white-space:nowrap;display:flex;align-items:center;gap:8px}
.topbar .logo span{font-size:22px}
.topbar .tabs{display:flex;flex:1;margin-left:24px;overflow-x:auto}
.topbar .tab{padding:14px 20px;cursor:pointer;font-size:15px;font-weight:600;border-bottom:3px solid transparent;transition:.2s;white-space:nowrap;user-select:none}
.topbar .tab:hover{background:rgba(255,255,255,.12)}
.topbar .tab.active{border-bottom-color:#fff;background:rgba(255,255,255,.18)}
.topbar .home-link{margin-left:auto;padding:8px 16px;color:#fff;text-decoration:none;font-size:13px;opacity:.85;white-space:nowrap}
.topbar .home-link:hover{opacity:1}

/* Main */
.main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.page{display:none}.page.active{display:block}

/* Progress Header */
.progress-header{background:var(--card);border-radius:16px;padding:20px 24px;margin-bottom:24px;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.progress-header .phase-info{flex:1;min-width:200px}
.progress-header .phase-info h3{font-size:1rem;color:var(--text);margin-bottom:4px}
.progress-header .phase-info p{font-size:.85rem;color:var(--text-muted)}
.progress-bar-wrap{flex:2;min-width:200px}
.progress-bar-label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text-muted);margin-bottom:6px}
.progress-bar{height:10px;background:#eee;border-radius:5px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--green));border-radius:5px;transition:width .5s}
.progress-stats{display:flex;gap:16px}
.stat-box{text-align:center;padding:8px 16px;background:var(--primary-light);border-radius:10px;min-width:70px}
.stat-box .num{font-size:1.3rem;font-weight:700;color:var(--primary-dark);display:block}
.stat-box .lbl{font-size:.72rem;color:var(--text-muted)}

/* Week Selector */
.week-selector{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.week-btn{padding:8px 16px;border:2px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text-soft);transition:.2s}
.week-btn:hover{border-color:var(--primary);color:var(--primary)}
.week-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.week-btn .done-dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-left:4px;vertical-align:middle}

/* Phase Tab */
.phase-tabs{display:flex;gap:8px;margin-bottom:16px}
.phase-tab{padding:10px 20px;border:2px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;font-size:.9rem;font-weight:600;transition:.2s}
.phase-tab:hover{border-color:var(--primary)}
.phase-tab.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}
.phase-tab.p1{}.phase-tab.p2{}.phase-tab.p3{}

/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.word-card{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--border);box-shadow:var(--shadow);transition:.25s;position:relative}
.word-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(31,30,28,.1)}
.word-card.learned{border-left:4px solid var(--green)}
.word-card .word-en{font-size:1.3rem;font-weight:700;color:var(--text);margin-bottom:2px}
.word-card .word-phonetic{font-size:.82rem;color:var(--text-muted);margin-bottom:6px}
.word-card .word-cn{font-size:.92rem;color:var(--text-soft);margin-bottom:10px}
.word-card .word-example{font-size:.84rem;color:var(--text-muted);background:#f8f6f3;padding:10px 12px;border-radius:8px;line-height:1.6;margin-bottom:12px}
.word-card .word-example .ex-cn{color:var(--text-muted);font-size:.8rem;margin-top:4px}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:.82rem;font-weight:600;color:var(--text-soft);transition:.2s}
.btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.btn.play-btn{color:var(--blue)}
.btn.play-btn:hover{border-color:var(--blue);background:#e3eef7}
.btn.rec-btn{color:var(--red)}
.btn.rec-btn:hover{border-color:var(--red);background:#fde8e8}
.btn.rec-btn.recording{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1s infinite}
.btn.learn-btn{color:var(--green)}
.btn.learn-btn:hover{border-color:var(--green);background:#e6f4ed}
.btn.learn-btn.done{background:var(--green);color:#fff;border-color:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* Score Badge */
.score-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:.78rem;font-weight:700;margin-left:auto}
.score-badge.high{background:#e6f4ed;color:var(--green)}
.score-badge.mid{background:#fff3e0;color:#e65100}
.score-badge.low{background:#fde8e8;color:var(--red)}

/* Sentence Cards */
.sentence-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px;transition:.25s}
.sentence-card:hover{box-shadow:0 8px 30px rgba(31,30,28,.1)}
.sentence-card.learned{border-left:4px solid var(--green)}
.sentence-card .scene-tag{display:inline-block;padding:2px 10px;border-radius:8px;font-size:.75rem;font-weight:600;margin-bottom:8px}
.scene-tag.meeting{background:#e3eef7;color:var(--blue)}
.scene-tag.site{background:#e6f4ed;color:var(--green)}
.scene-tag.report{background:var(--primary-light);color:var(--primary-dark)}
.scene-tag.discuss{background:#efe8f8;color:var(--purple)}
.sentence-card .sent-en{font-size:1.05rem;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.6}
.sentence-card .sent-cn{font-size:.88rem;color:var(--text-soft);margin-bottom:12px}

/* Recording Panel */
.rec-panel{background:#f8f6f3;border-radius:10px;padding:14px;margin-top:12px;display:none}
.rec-panel.show{display:block}
.rec-panel .rec-status{font-size:.85rem;color:var(--text-muted);margin-bottom:8px;min-height:20px}
.rec-panel .rec-result{margin-top:8px}
.rec-panel .rec-text{font-size:.88rem;color:var(--text-soft);padding:8px 12px;background:#fff;border-radius:8px;border:1px solid var(--border);min-height:40px;margin-bottom:8px}
.rec-panel .score-display{text-align:center;padding:12px}
.rec-panel .score-big{font-size:2.2rem;font-weight:700}
.rec-panel .score-big.high{color:var(--green)}
.rec-panel .score-big.mid{color:#e65100}
.rec-panel .score-big.low{color:var(--red)}
.rec-panel .score-label{font-size:.82rem;color:var(--text-muted)}
.rec-panel .score-detail{font-size:.8rem;color:var(--text-muted);margin-top:4px}
.rec-panel audio{width:100%;height:36px;margin-top:8px}

/* Progress Page */
.progress-page-header{text-align:center;padding:32px 20px;background:var(--card);border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:24px}
.progress-page-header h2{font-size:1.5rem;margin-bottom:8px}
.progress-page-header p{color:var(--text-muted);font-size:.9rem}
.progress-ring-wrap{display:flex;justify-content:center;gap:40px;margin:24px 0;flex-wrap:wrap}
.ring-item{text-align:center}
.ring-item .ring-label{font-size:.85rem;color:var(--text-soft);margin-top:8px;font-weight:600}
.ring-item .ring-sub{font-size:.78rem;color:var(--text-muted)}

.phase-progress{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px}
.phase-progress h3{font-size:1rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.phase-progress .week-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:.88rem}
.phase-progress .week-row:last-child{border-bottom:none}
.phase-progress .week-name{width:100px;font-weight:600;color:var(--text-soft)}
.phase-progress .week-bar{flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden}
.phase-progress .week-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.phase-progress .week-pct{width:50px;text-align:right;font-size:.82rem;color:var(--text-muted);font-weight:600}

.reset-section{text-align:center;margin-top:32px;padding:24px;background:var(--card);border-radius:14px;border:1px solid var(--border)}
.reset-section p{font-size:.88rem;color:var(--text-muted);margin-bottom:16px}
.reset-btn{padding:12px 32px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.2s}
.reset-btn:hover{background:#a93226;transform:scale(1.02)}

/* History */
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border);font-size:.85rem}
.history-item:last-child{border-bottom:none}
.history-item .h-date{color:var(--text-muted);width:90px;flex-shrink:0}
.history-item .h-text{flex:1;color:var(--text-soft)}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:10px;font-size:.9rem;font-weight:500;opacity:0;transition:.3s;z-index:999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:32px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:1.2rem;margin-bottom:12px}
.modal p{font-size:.9rem;color:var(--text-soft);margin-bottom:24px}
.modal-btns{display:flex;gap:12px;justify-content:center}
.modal-btns .btn-cancel{padding:10px 24px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:.9rem}
.modal-btns .btn-confirm{padding:10px 24px;border:none;border-radius:8px;background:var(--red);color:#fff;cursor:pointer;font-size:.9rem;font-weight:600}

/* Responsive */
@media(max-width:768px){
  .topbar-inner{flex-wrap:wrap}
  .topbar .tabs{margin-left:0;order:3;width:100%}
  .topbar .tab{padding:10px 14px;font-size:13px}
  .topbar .home-link{order:2}
  .cards-grid{grid-template-columns:1fr}
  .progress-header{flex-direction:column;gap:12px}
  .progress-stats{width:100%;justify-content:center}
  .progress-ring-wrap{gap:20px}
  .phase-progress .week-row{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span>&#127959;</span> 土木工程英语</div>
    <div class="tabs">
      <div class="tab active" data-page="vocab">&#128214; 词汇学习</div>
      <div class="tab" data-page="sentence">&#128172; 句型练习</div>
      <div class="tab" data-page="progress">&#128200; 学习进度</div>
    </div>
    <a href="index.html" class="home-link">&#8592; 返回首页</a>
  </div>
</div>

<div class="main">

<!-- ==================== VOCAB PAGE ==================== -->
<div class="page active" id="page-vocab">
  <div class="progress-header">
    <div class="phase-info"><h3>&#128218; 词汇学习</h3><p id="vocab-phase-desc">筑基期 · 基础结构术语</p></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-label"><span>总体词汇进度</span><span id="vocab-pct-text">0%</span></div>
      <div class="progress-bar"><div class="progress-bar-fill" id="vocab-pct-bar" style="width:0"></div></div>
    </div>
    <div class="progress-stats">
      <div class="stat-box"><span class="num" id="vocab-learned-count">0</span><span class="lbl">已学会</span></div>
      <div class="stat-box"><span class="num" id="vocab-total-count">0</span><span class="lbl">总词汇</span></div>
    </div>
  </div>

  <div class="phase-tabs" id="vocab-phase-tabs"></div>
  <div class="week-selector" id="vocab-week-selector"></div>
  <div class="cards-grid" id="vocab-cards"></div>
</div>

<!-- ==================== SENTENCE PAGE ==================== -->
<div class="page" id="page-sentence">
  <div class="progress-header">
    <div class="phase-info"><h3>&#128172; 句型练习</h3><p id="sent-phase-desc">工程场景核心句型</p></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-label"><span>总体句型进度</span><span id="sent-pct-text">0%</span></div>
      <div class="progress-bar"><div class="progress-bar-fill" id="sent-pct-bar" style="width:0"></div></div>
    </div>
    <div class="progress-stats">
      <div class="stat-box"><span class="num" id="sent-learned-count">0</span><span class="lbl">已掌握</span></div>
      <div class="stat-box"><span class="num" id="sent-total-count">0</span><span class="lbl">总句型</span></div>
    </div>
  </div>

  <div class="phase-tabs" id="sent-phase-tabs"></div>
  <div class="week-selector" id="sent-week-selector"></div>
  <div id="sent-cards"></div>
</div>

<!-- ==================== PROGRESS PAGE ==================== -->
<div class="page" id="page-progress">
  <div class="progress-page-header">
    <h2>&#127919; 学习进度总览</h2>
    <p>24周系统规划 · 追踪每一步成长</p>
    <div class="progress-ring-wrap" id="progress-rings"></div>
  </div>
  <div id="phase-progress-list"></div>
  <div class="phase-progress" style="margin-top:24px">
    <h3>&#128336; 最近练习记录</h3>
    <div class="history-list" id="history-list"><p style="color:var(--text-muted);font-size:.88rem;padding:8px 0">暂无练习记录</p></div>
  </div>
  <div class="reset-section">
    <p>&#9888;&#65039; 重置将清除所有学习进度和练习记录，此操作不可撤销</p>
    <button class="reset-btn" id="reset-btn">&#128260; 重置所有进度</button>
  </div>
</div>

</div><!-- /main -->

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>&#9888;&#65039; 确认重置</h3>
    <p>这将清除所有学习进度、录音打分记录。确定要重置吗？</p>
    <div class="modal-btns">
      <button class="btn-cancel" id="modal-cancel">取消</button>
      <button class="btn-confirm" id="modal-confirm">确认重置</button>
    </div>
  </div>
</div>

<script>
// ===========================
// DATA: Vocabulary organized by phase/week
// ===========================
const VOCAB_DATA = [
  // Phase 1: 筑基期 (Weeks 1-4)
  { phase: 1, phaseLabel: '筑基期', week: 1, weekLabel: '第1周 · 基础结构', words: [
    { en: 'foundation', phonetic: '/faʊnˈdeɪʃən/', cn: '基础；地基', example: 'The foundation must be strong enough to support the entire structure.', exCn: '地基必须足够坚固以支撑整个结构。' },

    { en: 'slab', phonetic: '/slæb/', cn: '板（楼板）', example: 'The floor slab thickness is 120 millimeters.', exCn: '楼板厚度为120毫米。' },

const STORAGE_KEY = 'civil-eng-english-v2';
let state = loadState();

function defaultState() {
  return { learnedVocab: {}, learnedSent: {}, scores: {}, history: [] };
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return s && s.learnedVocab ? s : defaultState();
  } catch { return defaultState(); }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    u.pitch = 1;
    // Try to find an English voice
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Female'))
                 || voices.find(v => v.lang.startsWith('en-US'))
                 || voices.find(v => v.lang.startsWith('en'));
    if (enVoice) u.voice = enVoice;
    window.speechSynthesis.speak(u);
  } else {
    showToast('浏览器不支持语音合成');
  }
}

// RECORDING & SCORING
// ===========================
let mediaRecorder = null;
let audioChunks = [];
let currentRecTarget = null;

async function startRecording(targetId, targetText) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      handleRecordingComplete(targetId, targetText, url);
    };
    mediaRecorder.start();
    currentRecTarget = targetId;
    return true;
  } catch (err) {
    showToast('无法访问麦克风，请允许麦克风权限');
    return false;
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
}

function handleRecordingComplete(targetId, targetText, audioUrl) {
  const panel = document.getElementById('rec-panel-' + targetId);
  if (!panel) return;

  // Show audio playback
  const audioEl = panel.querySelector('.rec-audio');
  if (audioEl) {
    audioEl.src = audioUrl;
    audioEl.style.display = 'block';
  }

  // Use Speech Recognition for scoring
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;

    // We'll re-play the recorded audio through recognition
    // Since direct audio-to-recognition isn't standard, we do real-time recognition
    // The score is calculated from what was recognized during recording
    // So we use a simpler approach: ask user to speak and recognize simultaneously

    panel.querySelector('.rec-status').textContent = '正在分析您的发音...';

    // Since we already recorded, use a heuristic scoring approach
    // We'll score based on the recording duration vs expected duration
    const expectedWords = targetText.toLowerCase().replace(/[^a-z\s'-]/g, '').split(/\s+/).filter(Boolean);

    // Create a new recognition instance to analyze
    const recog2 = new SpeechRecognition();
    recog2.lang = 'en-US';
    recog2.continuous = false;

    // Play back the audio and try to recognize
    // Actually, browsers can't feed recorded audio to speech recognition
    // So we'll score based on the initial real-time recognition we captured
    const recognized = panel.dataset.recognizedText || '';
    showScore(panel, targetText, recognized, targetId);
  } else {
    // Fallback: simple duration-based heuristic
    panel.querySelector('.rec-status').textContent = '浏览器不支持语音识别，使用基础评估';
    showScore(panel, targetText, '', targetId);
  }
}

// Real-time recognition during recording
async function startRecordingWithRecognition(targetId, targetText, btn) {
  const panel = document.getElementById('rec-panel-' + targetId);
  if (!panel) return;

  if (btn.classList.contains('recording')) {
    // Stop
    btn.classList.remove('recording');
    btn.innerHTML = '&#127908; 录音';
    stopRecording();
    if (window._currentRecognition) {
      try { window._currentRecognition.stop(); } catch {}
    }
    return;
  }

  panel.classList.add('show');
  panel.querySelector('.rec-status').textContent = '准备中...';
  panel.querySelector('.rec-result').style.display = 'none';
  const audioEl = panel.querySelector('.rec-audio');
  if (audioEl) audioEl.style.display = 'none';

  const started = await startRecording(targetId, targetText);
  if (!started) return;

  btn.classList.add('recording');
  btn.innerHTML = '&#9209; 停止';
  panel.querySelector('.rec-status').textContent = '&#128308; 正在录音...请朗读上方英文';
  panel.dataset.recognizedText = '';

  // Start speech recognition simultaneously
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;

    let finalTranscript = '';
    recognition.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          finalTranscript += e.results[i][0].transcript;
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      panel.dataset.recognizedText = finalTranscript || interim;
      panel.querySelector('.rec-status').innerHTML = '&#128308; 识别中: <em>' + (finalTranscript || interim) + '</em>';
    };

    recognition.onerror = () => {};
    recognition.onend = () => {};

    try {
      recognition.start();
      window._currentRecognition = recognition;
    } catch {}

    // Auto-stop after 15 seconds
    setTimeout(() => {
      if (btn.classList.contains('recording')) {
        btn.classList.remove('recording');
        btn.innerHTML = '&#127908; 录音';
        stopRecording();
        try { recognition.stop(); } catch {}
      }
    }, 15000);
  }
}

function showScore(panel, targetText, recognizedText, targetId) {
  const targetWords = targetText.toLowerCase().replace(/[^a-z\s'-]/g, '').split(/\s+/).filter(Boolean);
  const recogWords = recognizedText.toLowerCase().replace(/[^a-z\s'-]/g, '').split(/\s+/).filter(Boolean);

  let score = 0;
  if (recogWords.length > 0 && targetWords.length > 0) {
    // Calculate word match score
    let matched = 0;
    const targetSet = new Set(targetWords);
    recogWords.forEach(w => { if (targetSet.has(w)) matched++; });
    const precision = recogWords.length > 0 ? matched / recogWords.length : 0;
    const recall = targetWords.length > 0 ? matched / targetWords.length : 0;
    // Also consider order similarity
    let orderScore = 0;
    let lastIdx = -1;
    recogWords.forEach(w => {
      const idx = targetWords.indexOf(w);
      if (idx > lastIdx) { orderScore++; lastIdx = idx; }
    });
    const orderRatio = targetWords.length > 0 ? orderScore / targetWords.length : 0;

    score = Math.round((precision * 0.3 + recall * 0.4 + orderRatio * 0.3) * 100);
    score = Math.min(99, Math.max(5, score));
  } else if (recognizedText.length === 0) {
    // No recognition result - give a base score for attempting
    score = 0;
  }

  const resultDiv = panel.querySelector('.rec-result');
  resultDiv.style.display = 'block';

  const cls = score >= 80 ? 'high' : score >= 50 ? 'mid' : 'low';
  const feedback = score >= 80 ? '发音很棒！继续保持！' :
                   score >= 50 ? '不错的尝试，注意重音和连读' :
                   score > 0 ? '继续练习，多听标准发音后再试' : '未能识别语音，请靠近麦克风重试';

  resultDiv.innerHTML = `
    <div class="score-display">
      <div class="score-big ${cls}">${score}<span style="font-size:1rem">分</span></div>
      <div class="score-label">${feedback}</div>
      ${recognizedText ? '<div class="score-detail">识别内容: ' + recognizedText + '</div>' : '<div class="score-detail">未检测到语音输入</div>'}
    </div>
  `;
  panel.querySelector('.rec-status').textContent = '录音完成';

  // Save score
  if (score > 0) {
    const prevScore = state.scores[targetId] || 0;
    if (score > prevScore) state.scores[targetId] = score;
    state.history.unshift({
      date: new Date().toLocaleDateString('zh-CN'),
      text: targetText.substring(0, 40) + (targetText.length > 40 ? '...' : ''),
      score: score
    });
    if (state.history.length > 50) state.history = state.history.slice(0, 50);
    saveState();
  }
}

function getPhases(data) {
  const phases = [];
  const seen = new Set();
  data.forEach(d => {
    if (!seen.has(d.phase)) {
      seen.add(d.phase);
      phases.push({ phase: d.phase, label: d.phaseLabel });
    }
  });
  return phases;
}

function getWeeks(data, phase) {
  return data.filter(d => d.phase === phase);
}

function renderVocabPhaseTabs() {
  const container = document.getElementById('vocab-phase-tabs');
  const phases = getPhases(VOCAB_DATA);
  container.innerHTML = phases.map(p =>
    `<div class="phase-tab p${p.phase} ${p.phase === currentVocabPhase ? 'active' : ''}" data-phase="${p.phase}">${p.label}</div>`
  ).join('');
  container.querySelectorAll('.phase-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentVocabPhase = parseInt(tab.dataset.phase);
      const weeks = getWeeks(VOCAB_DATA, currentVocabPhase);
      currentVocabWeek = weeks[0].week;
      renderVocabPhaseTabs();
      renderVocabWeekSelector();
      renderVocabCards();
    });
  });
}

function renderVocabWeekSelector() {
  const container = document.getElementById('vocab-week-selector');
  const weeks = getWeeks(VOCAB_DATA, currentVocabPhase);
  container.innerHTML = weeks.map(w => {
    const total = w.words.length;
    const learned = w.words.filter(word => state.learnedVocab[`v_${w.week}_${word.en}`]).length;
    const allDone = learned === total;
    return `<button class="week-btn ${w.week === currentVocabWeek ? 'active' : ''}" data-week="${w.week}">
      ${w.weekLabel}${allDone ? '<span class="done-dot"></span>' : ''}
    </button>`;
  }).join('');
  container.querySelectorAll('.week-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentVocabWeek = parseInt(btn.dataset.week);
      renderVocabWeekSelector();
      renderVocabCards();
    });
  });
}

function renderVocabCards() {
  const container = document.getElementById('vocab-cards');
  const weekData = VOCAB_DATA.find(d => d.week === currentVocabWeek);
  if (!weekData) { container.innerHTML = ''; return; }

  document.getElementById('vocab-phase-desc').textContent = weekData.phaseLabel + ' · ' + weekData.weekLabel;

  container.innerHTML = weekData.words.map((w, i) => {
    const id = `v_${weekData.week}_${w.en}`;
    const isLearned = !!state.learnedVocab[id];
    const bestScore = state.scores[id] || 0;
    const scoreCls = bestScore >= 80 ? 'high' : bestScore >= 50 ? 'mid' : 'low';
    return `
    <div class="word-card ${isLearned ? 'learned' : ''}" id="card-${id}">
      <div class="word-en">${w.en}</div>
      <div class="word-phonetic">${w.phonetic}</div>
      <div class="word-cn">${w.cn}</div>
      <div class="word-example">
        ${w.example}
        <div class="ex-cn">${w.exCn}</div>
      </div>
      <div class="btn-row">
        <button class="btn play-btn" onclick="speak('${w.en.replace(/'/g, "\\'")}')">&#128264; 单词</button>
        <button class="btn play-btn" onclick="speak(\`${w.example.replace(/`/g, '\\`').replace(/'/g, "\\'")}\`)">&#128266; 例句</button>
        <button class="btn rec-btn" onclick="startRecordingWithRecognition('${id}', '${w.en.replace(/'/g, "\\'")}', this)">&#127908; 录音</button>
        <button class="btn learn-btn ${isLearned ? 'done' : ''}" onclick="toggleLearnVocab('${id}', this)">${isLearned ? '&#10003; 已学会' : '&#9744; 标记学会'}</button>
        ${bestScore > 0 ? `<span class="score-badge ${scoreCls}">&#127942; ${bestScore}分</span>` : ''}
      </div>
      <div class="rec-panel" id="rec-panel-${id}">
        <div class="rec-status"></div>
        <audio class="rec-audio" controls style="display:none"></audio>
        <div class="rec-result" style="display:none"></div>
      </div>
    </div>`;
  }).join('');

  updateVocabProgress();
}

function toggleLearnVocab(id, btn) {
  if (state.learnedVocab[id]) {
    delete state.learnedVocab[id];
    btn.classList.remove('done');
    btn.innerHTML = '&#9744; 标记学会';
    btn.closest('.word-card').classList.remove('learned');
  } else {
    state.learnedVocab[id] = true;
    btn.classList.add('done');
    btn.innerHTML = '&#10003; 已学会';
    btn.closest('.word-card').classList.add('learned');
    showToast('太棒了！又掌握了一个词汇！');
  }
  saveState();
  updateVocabProgress();
  renderVocabWeekSelector();
}

function updateVocabProgress() {
  let total = 0, learned = 0;
  VOCAB_DATA.forEach(w => {
    w.words.forEach(word => {
      total++;
      if (state.learnedVocab[`v_${w.week}_${word.en}`]) learned++;
    });
  });
  const pct = total > 0 ? Math.round(learned / total * 100) : 0;
  document.getElementById('vocab-pct-text').textContent = pct + '%';
  document.getElementById('vocab-pct-bar').style.width = pct + '%';
  document.getElementById('vocab-learned-count').textContent = learned;
  document.getElementById('vocab-total-count').textContent = total;
}

    const scoreCls = bestScore >= 80 ? 'high' : bestScore >= 50 ? 'mid' : 'low';
    return `
    <div class="sentence-card ${isLearned ? 'learned' : ''}">
      <span class="scene-tag ${s.scene}">${sceneLabels[s.scene] || s.scene}</span>
      <div class="sent-en">${s.en}</div>
      <div class="sent-cn">${s.cn}</div>
      <div class="btn-row">
        <button class="btn play-btn" onclick="speak(\`${s.en.replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`)">&#128266; 朗读</button>
        <button class="btn play-btn" onclick="speak(\`${s.en.replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`); this.textContent='&#128264; 慢速播放中...'; setTimeout(()=>this.innerHTML='&#128264; 慢速',2000)" style="display:none">&#128264; 慢速</button>
        <button class="btn rec-btn" onclick="startRecordingWithRecognition('${id}', \`${s.en.replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`, this)">&#127908; 录音对比</button>
        <button class="btn learn-btn ${isLearned ? 'done' : ''}" onclick="toggleLearnSent('${id}', this)">${isLearned ? '&#10003; 已掌握' : '&#9744; 标记掌握'}</button>
        ${bestScore > 0 ? `<span class="score-badge ${scoreCls}">&#127942; ${bestScore}分</span>` : ''}
      </div>
      <div class="rec-panel" id="rec-panel-${id}">
        <div class="rec-status"></div>
        <audio class="rec-audio" controls style="display:none"></audio>
        <div class="rec-result" style="display:none"></div>
      </div>
    </div>`;
  }).join('');

  updateSentProgress();
}

function toggleLearnSent(id, btn) {
  if (state.learnedSent[id]) {
    delete state.learnedSent[id];
    btn.classList.remove('done');
    btn.innerHTML = '&#9744; 标记掌握';
    btn.closest('.sentence-card').classList.remove('learned');
  } else {
    state.learnedSent[id] = true;
    btn.classList.add('done');
    btn.innerHTML = '&#10003; 已掌握';
    btn.closest('.sentence-card').classList.add('learned');
    showToast('很好！又掌握了一个句型！');
  }
  saveState();
  updateSentProgress();
  renderSentWeekSelector();
}

function updateSentProgress() {
  let total = 0, learned = 0;
  SENTENCE_DATA.forEach(w => {
    w.sentences.forEach((s, i) => {
      total++;
      if (state.learnedSent[`s_${w.week}_${i}`]) learned++;
    });
  });
  const pct = total > 0 ? Math.round(learned / total * 100) : 0;
  document.getElementById('sent-pct-text').textContent = pct + '%';
  document.getElementById('sent-pct-bar').style.width = pct + '%';
  document.getElementById('sent-learned-count').textContent = learned;
  document.getElementById('sent-total-count').textContent = total;
}

// ===========================
// RENDER: Progress Page
// ===========================
function renderProgressPage() {
  // Overall stats
  let totalVocab = 0, learnedVocab = 0;
  VOCAB_DATA.forEach(w => { w.words.forEach(word => { totalVocab++; if (state.learnedVocab[`v_${w.week}_${word.en}`]) learnedVocab++; }); });

  let totalSent = 0, learnedSent = 0;
  SENTENCE_DATA.forEach(w => { w.sentences.forEach((s, i) => { totalSent++; if (state.learnedSent[`s_${w.week}_${i}`]) learnedSent++; }); });

  const totalAll = totalVocab + totalSent;
  const learnedAll = learnedVocab + learnedSent;
  const pctAll = totalAll > 0 ? Math.round(learnedAll / totalAll * 100) : 0;
  const pctV = totalVocab > 0 ? Math.round(learnedVocab / totalVocab * 100) : 0;
  const pctS = totalSent > 0 ? Math.round(learnedSent / totalSent * 100) : 0;

  // Average score
  const scoreVals = Object.values(state.scores);
  const avgScore = scoreVals.length > 0 ? Math.round(scoreVals.reduce((a, b) => a + b, 0) / scoreVals.length) : 0;

  document.getElementById('progress-rings').innerHTML = `
    <div class="ring-item">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#eee" stroke-width="8"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--primary)" stroke-width="8"
          stroke-dasharray="${2 * Math.PI * 42}" stroke-dashoffset="${2 * Math.PI * 42 * (1 - pctAll / 100)}"
          transform="rotate(-90 50 50)" stroke-linecap="round"/>
        <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
          font-size="22" font-weight="700" fill="var(--primary-dark)">${pctAll}%</text>
      </svg>
      <div class="ring-label">总体进度</div>
      <div class="ring-sub">${learnedAll} / ${totalAll}</div>
    </div>
    <div class="ring-item">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#eee" stroke-width="8"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--blue)" stroke-width="8"
          stroke-dasharray="${2 * Math.PI * 42}" stroke-dashoffset="${2 * Math.PI * 42 * (1 - pctV / 100)}"
          transform="rotate(-90 50 50)" stroke-linecap="round"/>
        <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
          font-size="22" font-weight="700" fill="var(--blue)">${pctV}%</text>
      </svg>
      <div class="ring-label">词汇进度</div>
      <div class="ring-sub">${learnedVocab} / ${totalVocab} 词</div>
    </div>
    <div class="ring-item">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#eee" stroke-width="8"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--green)" stroke-width="8"
          stroke-dasharray="${2 * Math.PI * 42}" stroke-dashoffset="${2 * Math.PI * 42 * (1 - pctS / 100)}"
          transform="rotate(-90 50 50)" stroke-linecap="round"/>
        <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
          font-size="22" font-weight="700" fill="var(--green)">${pctS}%</text>
      </svg>
      <div class="ring-label">句型进度</div>
      <div class="ring-sub">${learnedSent} / ${totalSent} 句</div>
    </div>
    <div class="ring-item">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#eee" stroke-width="8"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--purple)" stroke-width="8"
          stroke-dasharray="${2 * Math.PI * 42}" stroke-dashoffset="${2 * Math.PI * 42 * (1 - avgScore / 100)}"
          transform="rotate(-90 50 50)" stroke-linecap="round"/>
        <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
          font-size="22" font-weight="700" fill="var(--purple)">${avgScore}</text>
      </svg>
      <div class="ring-label">平均发音评分</div>
      <div class="ring-sub">${scoreVals.length} 次练习</div>
    </div>
  `;

  // Phase-level progress
  const phaseList = document.getElementById('phase-progress-list');
  const allData = [
    { label: '筑基期', phase: 1, color: 'var(--primary)' },
    { label: '进阶期', phase: 2, color: 'var(--green)' },
    { label: '应用期', phase: 3, color: 'var(--blue)' },
  ];

  phaseList.innerHTML = allData.map(p => {
    const vocabWeeks = VOCAB_DATA.filter(d => d.phase === p.phase);
    const sentWeeks = SENTENCE_DATA.filter(d => d.phase === p.phase);
    let rows = '';

    vocabWeeks.forEach(w => {
      const total = w.words.length;
      const learned = w.words.filter(word => state.learnedVocab[`v_${w.week}_${word.en}`]).length;
      const pct = total > 0 ? Math.round(learned / total * 100) : 0;
      rows += `<div class="week-row">
        <span class="week-name">&#128214; ${w.weekLabel.split('·')[0].trim()}</span>
        <div class="week-bar"><div class="week-bar-fill" style="width:${pct}%;background:${p.color}"></div></div>
        <span class="week-pct">${learned}/${total}</span>
      </div>`;
    });

    sentWeeks.forEach(w => {
      const total = w.sentences.length;
      const learned = w.sentences.filter((s, i) => state.learnedSent[`s_${w.week}_${i}`]).length;
      const pct = total > 0 ? Math.round(learned / total * 100) : 0;
      rows += `<div class="week-row">
        <span class="week-name">&#128172; ${w.weekLabel.split('·')[0].trim()}</span>
        <div class="week-bar"><div class="week-bar-fill" style="width:${pct}%;background:${p.color}"></div></div>
        <span class="week-pct">${learned}/${total}</span>
      </div>`;
    });

    return `<div class="phase-progress">
      <h3><span style="color:${p.color}">&#9679;</span> ${p.label}</h3>
      ${rows}
    </div>`;
  }).join('');

  // History
  const historyEl = document.getElementById('history-list');
  if (state.history.length === 0) {
    historyEl.innerHTML = '<p style="color:var(--text-muted);font-size:.88rem;padding:8px 0">暂无练习记录</p>';
  } else {
    historyEl.innerHTML = state.history.slice(0, 20).map(h => {
      const cls = h.score >= 80 ? 'high' : h.score >= 50 ? 'mid' : 'low';
      return `<div class="history-item">
        <span class="h-date">${h.date}</span>
        <span class="h-text">${h.text}</span>
        <span class="score-badge ${cls}">&#127942; ${h.score}分</span>
      </div>`;
    }).join('');
  }
}

// ===========================
// RESET
// ===========================
document.getElementById('reset-btn').addEventListener('click', () => {
  document.getElementById('modal').classList.add('show');
});

document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
});

document.getElementById('modal-confirm').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
  state = defaultState();
  saveState();
  renderVocabCards();
  renderVocabWeekSelector();
  renderSentCards();
  renderSentWeekSelector();
  updateVocabProgress();
  updateSentProgress();
  renderProgressPage();
  showToast('所有进度已重置');
});

// ===========================
// TOAST
// ===========================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===========================
// INIT
// ===========================
renderVocabPhaseTabs();
renderVocabWeekSelector();
renderVocabCards();
renderSentPhaseTabs();
renderSentWeekSelector();
renderSentCards();

</script>
</body>
</html>
